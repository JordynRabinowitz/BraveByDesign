<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A warm illustrated school hallway</title><desc id="desc">A school corridor with a classroom door, lockers, restroom entrance, and library door.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e3e9f2"/><stop offset="1" stop-color="#d9e5e8"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4d4c9"/><stop offset="1" stop-color="#bfaead"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b0a2ca"/><stop offset="1" stop-color="#7d6b9b"/></linearGradient>
  <filter id="shade"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="720" fill="url(#wall)"/>
