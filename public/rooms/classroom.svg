<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A warm illustrated classroom</title><desc id="desc">A classroom wall with windows, a whiteboard, bulletin board, hallway door, and desks arranged for collaborative learning.</desc>
<defs>
  <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#F8EAE5"/><stop offset="1" stop-color="#EDDBDB"/></linearGradient>
  <linearGradient id="floor" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#DCC4BE"/><stop offset="1" stop-color="#BE9F9F"/></linearGradient>
  <linearGradient id="window" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#BCE2EA"/><stop offset="1" stop-color="#EFF5DF"/></linearGradient>
  <linearGradient id="desk" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5C59C"/><stop offset="1" stop-color="#D99878"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<!-- wall and floor -->
<rect width="1200" height="720" fill="url(#wall)"/>
